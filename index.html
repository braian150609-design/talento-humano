<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Asistencia - Sede</title>
    <!-- Tailwind CSS para diseño rápido y moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 w-full max-w-md shadow-2xl">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-emerald-400">Control de Asistencia</h1>
            <p class="text-slate-400 text-sm mt-1">Registra tu entrada validando tu ubicación</p>
        </div>

        <form id="attendanceForm" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Nombre Completo</label>
                <input type="text" id="nombre" required 
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-emerald-500"
                    placeholder="Ej. Juan Pérez">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Cédula de Identidad</label>
                <input type="text" id="cedula" required 
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-emerald-500"
                    placeholder="Ej. V12345678">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Correo Electrónico</label>
                <input type="email" id="correo" required 
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-emerald-500"
                    placeholder="correo@empresa.com">
            </div>

            <!-- Estado de ubicación -->
            <div id="statusBox" class="p-3 rounded-lg text-sm bg-slate-900/50 border border-slate-700 text-slate-300 flex items-center gap-2">
                <span id="statusDot" class="w-3 h-3 rounded-full bg-amber-500 animate-pulse"></span>
                <span id="statusText">Verificando tu ubicación GPS...</span>
            </div>

            <button type="submit" id="submitBtn" disabled
                class="w-full bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-700 disabled:text-slate-500 text-white font-semibold py-3 rounded-lg transition-all shadow-lg">
                Registrar Asistencia
            </button>
        </form>
    </div>

    <!-- Scripts de Firebase (Modular v10) y lógica de ubicación -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Configuración de tu Firebase
     const firebaseConfig = {
  apiKey: "AIzaSyCOcr_21YZWGfF77fGWfL02JeGy3Du2jB4",
  authDomain: "talento-humano-72df2.firebaseapp.com",
  databaseURL: "https://talento-humano-72df2-default-rtdb.firebaseio.com",
  projectId: "talento-humano-72df2",
  storageBucket: "talento-humano-72df2.firebasestorage.app",
  messagingSenderId: "37824817227",
  appId: "1:37824817227:web:8c4fb343c68d2a3f10c5ce",
  measurementId: "G-3ZH98KBGLN"
};

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ==========================================
        // CONFIGURACIÓN DE COORDENADAS DE LA SEDE
        // ==========================================
        const SEDE_LAT = 10.80936017593138; // Reemplaza con la latitud de tu sede
        const SEDE_LNG = -71.75399219650483; // Reemplaza con la longitud de tu sede
        const RADIO_MAXIMO_METROS = 2050; // Distancia permitida

        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const submitBtn = document.getElementById('submitBtn');
        const attendanceForm = document.getElementById('attendanceForm');

        let userLocation = null;

        // Función para calcular distancia en metros usando la fórmula de Haversine
        function calcularDistancia(lat1, lon1, lat2, lon2) {
            const R = 6371e3; // Radio de la tierra en metros
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = 
                Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c; // Distancia en metros
        }

        // Obtener la geolocalización al cargar la página
        function verificarUbicacion() {
            if (!navigator.geolocation) {
                statusDot.className = "w-3 h-3 rounded-full bg-red-500";
                statusText.innerText = "Tu navegador no soporta geolocalización.";
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    userLocation = { lat, lng };

                    const distancia = calcularDistancia(lat, lng, SEDE_LAT, SEDE_LNG);

                    if (distancia <= RADIO_MAXIMO_METROS) {
                        statusDot.className = "w-3 h-3 rounded-full bg-emerald-500";
                        statusText.innerText = `Ubicación verificada. Estás a ${Math.round(distancia)}m de la sede.`;
                        submitBtn.disabled = false;
                    } else {
                        statusDot.className = "w-3 h-3 rounded-full bg-red-500";
                        statusText.innerText = `Estás muy lejos de la sede (${Math.round(distancia)}m). Acércate a menos de 50m.`;
                        submitBtn.disabled = true;
                    }
                },
                (error) => {
                    statusDot.className = "w-3 h-3 rounded-full bg-red-500";
                    statusText.innerText = "Error al obtener GPS. Activa tu ubicación.";
                    console.error(error);
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        verificarUbicacion();

        // Manejo del envío del formulario
        attendanceForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!userLocation) {
                alert("Primero debes permitir y verificar tu ubicación.");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = "Registrando...";

            try {
                // Guardar en Firestore colección 'asistencias'
                await addDoc(collection(db, "asistencias"), {
                    nombre: document.getElementById('nombre').value.trim(),
                    cedula: document.getElementById('cedula').value.trim(),
                    correo: document.getElementById('correo').value.trim(),
                    timestamp: serverTimestamp(),
                    ubicacion: {
                        lat: userLocation.lat,
                        lng: userLocation.lng
                    }
                });

                alert("¡Asistencia registrada con éxito!");
                attendanceForm.reset();
                submitBtn.innerText = "Registrado";
            } catch (error) {
                console.error("Error al registrar asistencia: ", error);
                alert("Hubo un error al guardar los datos. Inténtalo de nuevo.");
                submitBtn.disabled = false;
                submitBtn.innerText = "Registrar Asistencia";
            }
        });
    </script>
</body>
</html>
